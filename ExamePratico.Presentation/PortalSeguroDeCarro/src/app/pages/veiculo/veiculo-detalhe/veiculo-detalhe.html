<section class="veiculo">
  <div class="veiculo__container">
    <h1 class="veiculo__titulo"><span class="fa-solid fa-car-side"></span> {{ acao }} Veículo</h1>
  </div>

  <form [formGroup]="form" autocomplete="off" (ngSubmit)="onSubmit()">
    <fieldset>
      @if (acao === 'Editar') {
      <div>
        <label for="veiculoId">Id</label>
        <input type="number" id="veiculoId" formControlName="veiculoId" readonly />
      </div>
      }
      <div>
        <label for="marca">Marca</label>
        <input type="text" id="marca" formControlName="marca" />
      </div>
      <div>
        <label for="modelo">Modelo</label>
        <input type="text" id="modelo" formControlName="modelo" />
      </div>
      <div>
        <label for="valor">Valor</label>
        <input type="text"
             id="valor"
             placeholder="R$ 0,00"
             appMaskDinheiroBr
             formControlName="valorDoVeiculo" />
        <!-- <input
          type="text"
          appCurrencyMask
          placeholder="R$ 0,00"
          id="valor"
          formControlName="valorDoVeiculo"
        /> -->
      </div>
      <div class="box_duplo">
        @if (form.value.dataCadastro.length > 0) {
        <div>
          <label for="dataNascimento">Data Criação</label>
          <input type="date" id="dataNascimento" formControlName="dataCadastro" readonly />
        </div>
        } @if(form.value.dataUltimaAlteracao.length > 0) {
        <div>
          <label for="dataNascimento">Data Ultima Alteração</label>
          <input type="date" id="dataNascimento" formControlName="dataUltimaAlteracao" readonly />
        </div>
        }
      </div>
    </fieldset>
    <div>
      <button class="veiculo__botao_cancelar" type="button" [routerLink]="['/veiculo']" routerLinkActive="router-link-active" >Cancelar</button>
      <button class="veiculo__botao_editar" type="submit">Enviar</button>
    </div>
  </form>
</section>
