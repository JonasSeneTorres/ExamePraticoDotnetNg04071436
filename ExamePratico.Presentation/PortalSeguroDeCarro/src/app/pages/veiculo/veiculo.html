<section class="veiculo">

  <div class="veiculo__container-botao">
    <h1 class="veiculo__titulo"><span class="fa-solid fa-car-side"></span> Veículos</h1>
    <a class="veiculo__link" [routerLink]="['/veiculo/novo']">Novo</a>
  </div>

  <div class="veiculo__ctabela">
    @if (processando) {
      <app-spinner />
    } @else {

    }
    <table class="veiculo__tabela">
      <thead>
        <tr>
          <td>Id</td>
          <td>Marca</td>
          <td>Modelo</td>
          <td>Valor veiculo</td>
          <td></td>
        </tr>
      </thead>
      <tbody>
        @if (lista.length === 0) {
          <tr><td class="center" colspan="5">Não há nenhum registro no momento</td></tr>
        }
        @else {
          @for (item of lista; track item.veiculoId) {
            <tr>
              <td>{{ item?.veiculoId }}</td>
              <td>{{ item?.marca }}</td>
              <td>{{ item?.modelo }}</td>
              <td>{{ item?.valorDoVeiculo | currency:'BRL' }}</td>
              <td class="center">
                <button type="button" class="veiculo__botao_editar" [routerLink]="['editar', item?.veiculoId]">
                  <span class="fa fa-pencil" aria-hidden="true"></span>
                </button>
                <button type="button" class="veiculo__botao_cancelar" (click)="openDialog(item)">
                  <span class="fa fa-times" aria-hidden="true"></span>
                </button>
              </td>
            </tr>
          }
        }
      </tbody>
    </table>
  </div>
</section>
