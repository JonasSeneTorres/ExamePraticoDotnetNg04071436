<section class="seguro">
  <div class="seguro__container">
    <h1 class="seguro__titulo"><span class="fa fa-file-text" aria-hidden="true"></span> {{ acao }} Seguro</h1>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <fieldset>
      @if (acao === 'Editar') {
        <div>
          <label for="veiculoId">Id</label>
          <input type="number" id="veiculoId" formControlName="veiculoId" readonly>
        </div>
      }
      <div>
        <label for="nome">Nome</label>
        <input type="text" id="nome" formControlName="nome">
      </div>
      <div>
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" formControlName="cpf">
      </div>
      <div class="box_duplo">
        <div>
          <label for="dataNascimento">Data de Nascimento</label>
          <input type="date" id="dataNascimento" formControlName="dataNascimento" [min]="minDate" [max]="maxDate">
        </div>
        <div>
          <label for="idade">Idade</label>
          <input type="number" id="idade" formControlName="idade" readonly>
        </div>
      </div>
      <div class="box_duplo">
          @if (form.value.dataCadastro.length > 0) {
            <div>
              <label for="dataNascimento">Data Criação</label>
              <input type="date" id="dataNascimento" formControlName="dataCadastro" readonly>
            </div>
          }
          @if(form.value.dataUltimaAlteracao.length > 0) {
            <div>
              <label for="dataNascimento">Data Ultima Alteração</label>
              <input type="date" id="dataNascimento" formControlName="dataUltimaAlteracao" readonly>
            </div>
          }
        </div>
    </fieldset>
    <div>
      <button class="seguro__botao_cancelar" type="button">Cancelar</button>
      <button class="seguro__botao_editar" type="submit">Enviar</button>
    </div>
  </form>
</section>
